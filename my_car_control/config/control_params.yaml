# 控制节点参数配置（基于NCSC2024源程序racecar_teleop_test.py）
control_node:
  ros__parameters:
    
    # =========================================================================
    # WARNING: yellow_curve_angle / yellow_curve_speed —— YAML 不生效（陷阱）
    # =========================================================================
    # 这两个参数在 YAML 里写了但 control_node.py 第 196-197 行没用
    # declare_parameter() 接通，而是直接硬编码：
    #     self.yellow_curve_angle = 25.0
    #     self.yellow_curve_speed = 25
    # 所以改 YAML 这里完全不生效，实际跑的就是代码硬编码的 25.0/25。
    #
    # 原 YAML 写 27.0，已修正为 25.0 与代码硬编码一致（YAML 本来就不生效，
    # 此改动不影响实际行为，只是避免误导）。
    #
    # 未来若要让 YAML 真的可调：改 control_node.py 第 196-197 行用
    # declare_parameter() 替换硬编码即可（小风险代码改动，建议上车实测后再做）。
    # =========================================================================
    yellow_curve_angle: 25.0            # 死参数，与代码硬编码一致
    yellow_curve_speed: 25              # 死参数，与代码硬编码一致
    
    # === V8: 向右修正（三等分点为空）专用转向角 ===
    # 当内外道配对失败或外道点被过滤时，向右转向寻找外道锥桶
    right_correction_angle: -5.0  # 向右转向角度（-5度，最终角度=75-5=70度）

    # 速度控制参数（实际速度 = 1500 + 档位值，改为25档）
    base_speed: 25      # 基础速度档位 (1525)
    circle1_speed: 25      # 第一圈速度 (1525)
    circle2_speed: 25      # 第二圈速度 (1525)
    park_speed: 25       # 停车速度 (1525)
    
    # === 实时速度动态PID参数（雷达循迹模式使用，移植自line_follow.py）===
    # 注意：雷达循迹模式现在使用实时速度（m/s）动态查找PID参数，而不是速度档位
    velocity_pid_low_speed_threshold: 1.5    # 低速阈值（m/s），低于此值使用低速PID参数
    velocity_pid_low_speed_params: [-60.0, 0.0, 30.0]    # 低速PID参数 [P, I, D]（速度 < 1.5 m/s）
    velocity_pid_high_speed_params: [-65.0, 0.0, 30.0]   # 高速PID参数 [P, I, D]（速度 >= 1.5 m/s）
    velocity_pid_max_velocity: 2.5          # 最大速度限制（m/s），用于参数查找
    
    # PID参数（基于源程序的pidList）- 降低P值减小摆动，增大D值抑制过冲
    # 注意：这些参数现在主要用于active_pid函数，雷达循迹模式已改用实时速度动态PID
    pid_params_5: [-45.0, 0.0, 0.3]      # 直角弯后续帧专用 (1505) - 超低速PID
    pid_params_10: [-55.0, 0.0, 0.5]     # 备用 (1510) - 超低速PID
    pid_params_12: [-60.0, 0.0, 0.6]     # 黄线弯专用 (1512) - 低速PID
    pid_params_16: [-65.0, 0.0, 0.8]     # 备用 (1516) - 超低速PID
    pid_params_18: [-70.0, 0.0, 1.0]     # 极低速PID (1518) - 降低P，增大D
    pid_params_19: [-75.0, 0.0, 1.2]     # 超低速PID (1519) - 降低P，增大D
    pid_params_20: [-80.0, 0.0, 1.0]     # 低速PID (1520) - 降低P，增大D
    pid_params_22: [-85.0, 0.0, 1.2]     # 中低速PID (1522) - 降低P，增大D
    pid_params_25: [-110.0, 0.0, 3.5]     # 第一圈速度PID (1525) - 大幅提高P值增强响应速度
    pid_params_28: [-115.0, 0.0, 4.0]    # 第二圈速度PID (1528) - 大幅提高P值增强响应速度
    pid_params_30: [-110.0, 0.0, 0.15]   # 备用PID (1530)
    pid_params_35: [-120.0, 0.0, 0.18]   # 备用PID (1535)
    pid_params_45: [-80.0, 0.0, 0.1]     # 备用PID (1545)
    pid_params_50: [-90.0, 0.0, 0.2]     # 备用PID (1550)
    pid_params_65: [-90.0, 0.0, 0.1]
    pid_params_70: [-140.0, 0.0, 0.5]
    pid_params_75: [-120.0, 0.0, 20.0]
    pid_params_80: [-145.0, 0.0, 10.0]
    pid_params_85: [-185.0, 0.0, 15.0]
    
    # 动态PID参数
    pid_k_factor: 0.3       # 直道PID中P的比例因子
    max_error: 100.0        # 最大误差（用于积分分离）
    alpha_factor: -0.05     # 积分分离Alpha因子
    sum_err_threshold: 100.0 # 积分项上限
    min_dist_threshold: 0.3  # 到达目标点的最小距离
    
    # 转向参数（基于源程序的turnTheta）- 与速度档位对应
    # 注意：最终角度 = 75 + turn_theta，平衡配置避免拐出赛道
    # 直角弯模式（备份版本逻辑）：首帧降速40档（无限制），后续5档
    # 黄线弯模式（锁定逻辑）：固定16档速度，直到识别到有效目标点
    turn_theta_3: [40, 40]      # 直角弯后续帧专用 (1503) → 115°（75+40）
    turn_theta_5: [80, 80]      # 直角弯后续帧备用 (1505) → 155°（75+80，增大角度避免冲出去）
    turn_theta_10: [40, 40]     # 备用 (1510) → 115°（75+40）
    turn_theta_12: [45, 45]     # 黄线弯专用 (1512) → 120°（75+45）
    turn_theta_16: [37, 37]     # 备用 (1516) → 112°（75+37）
    turn_theta_18: [36, 36]     # 极低速转向 (1518) → 111°（加大4°）
    turn_theta_19: [35, 35]     # 超低速转向 (1519) → 110°（加大4°）
    turn_theta_20: [34, 34]     # 低速转向 (1520) → 109°（加大4°）
    turn_theta_22: [33, 33]     # 中低速转向 (1522) → 108°（加大4°）
    turn_theta_25: [34, 34]     # 第一圈正常 (1525) → 109°（加大4°）
    turn_theta_28: [32, 32]     # 第二圈正常 (1528) → 107°（加大4°）
    turn_theta_30: [40, 40]     # 备用转向 (1530)
    turn_theta_35: [42, 42]     # 备用转向 (1535)
    turn_theta_45: [30, 30]     # 备用转向 (1545)
    turn_theta_50: [35, 35]     # 备用转向 (1550)
    turn_theta_65: [36, 36]
    turn_theta_70: [45, 45]
    turn_theta_75: [45, 47]
    turn_theta_80: [55, 60]
    turn_theta_85: [100, 100]
    # =========================================================================
    # 2025 改造补：以下参数原本在 control_node.py declare_parameter 了但
    #             control_params.yaml 没显式列出，导致只能用代码默认值不能
    #             从 YAML 调。补在这里让所有可调参数一目了然。值与 control
    #             _node.py 的 declare_parameter 默认值完全一致，行为不变。
    # =========================================================================

    # ----- 红灯停车 -----
    target_stop_duration: 4.0           # 红灯停车持续时间（秒）

    # ----- XY 坐标停车（check_xy_parking 机制）-----
    # 当前未启用：enable_xy_parking=False, park_points=[]
    # park_points 格式: [[x, y, tolerance(米), duration(秒), circle], ...]
    # 警告：依赖 self.circle，但 control_node.py 当前 self.circle 永远=1，
    #      所以即使启用，配 circle=2 的停车点也永远不会触发。
    # 不确定：比赛时学长是否通过其它方式启用过这个机制（如命令行参数、
    #        修改过的 yaml），rar 里这份代码默认是关闭的。
    enable_xy_parking: False
    park_points: []

    # ----- 坐标打印（用于手推车标定停车点坐标）-----
    print_position: True
    position_print_interval: 0.5        # 打印间隔（秒）

    # ----- NavigationManager 第一圈记录 + 第二圈回放 -----
    # 当前状况：control_node.py 第 1345 行调了 start_recording() 启动累积，
    #          但代码里没有任何地方调 save_points_to_csv() 或
    #          load_points_from_csv()，所以 CSV 文件永远不生成，
    #          第二圈回放永远不会发生。整套 NavigationManager 是"摆设"，
    #          但代码完整，未来要启用只需要补 save/load 的触发点。
    enable_navigation_recording: True
    record_interval: 0.5                # 第一圈记录间隔（秒）
    navigation_csv_path: '~/navigation_points.csv'
    navigation_min_distance: 0.8        # 第二圈到达目标点的最小距离（米）
    enable_navigation_loop: True