# =============================================================================
# 感知节点参数配置 - perception_node_simple_cluster.py
#
# 用法：
#   被 perception_control.launch.py 加载，所有参数运行时可改 YAML 不改代码。
#
# 行为：
#   本文件的默认值与 perception_node_simple_cluster.py 中 declare_parameter
#   的默认值完全一致。也就是说，相比"硬编码"运行时**完全没有行为变化**，
#   只是把硬编码暴露出来供调整。
#
# 注意：
#   1. 节点的运行时名字是 'perception_node'（见 perception_node_simple_cluster
#      .py 第 82 行 super().__init__('perception_node')），所以这里的顶层 key
#      必须是 perception_node，不是 perception_node_simple_cluster。
#   2. perception_node.py（KMeans 路径）目前不读 YAML，参数硬编码。这个文件
#      被 full_system / modular_system / perception_only 三个 launch 加载时，
#      KMeans 节点会忽略全部参数（ROS2 警告但不崩）。这是已知现状，不影响
#      perception_control.launch.py 的使用。
#   3. 修改参数后只需重启节点，不需要 colcon build。
# =============================================================================

perception_node:
  ros__parameters:

    # -------------------------------------------------------------------------
    # 黄线弯/扇形无锥桶检测（用于触发 -10000 YELLOW_CURVE 模式）
    # -------------------------------------------------------------------------
    no_cone_detection_range: 2.0      # 扇形检测距离 (m)
    no_cone_sector_angle: 84.0        # 扇形检测半角 (度)
    no_cone_sector_threshold: 1       # 扇形区域内的噪声点容忍数量

    # -------------------------------------------------------------------------
    # 激光雷达点云滤波（矩形 ROI，去掉不感兴趣区域的点）
    # -------------------------------------------------------------------------
    min_range: 0.2                    # 最小有效极径 (m) - 滤掉太近的噪声
    max_range: 3.5                    # 最大有效极径 (m) - 滤掉远处不可靠的点
    left_width: 2.5                   # 矩形 ROI 左侧宽度 (m)
    right_width: 1.0                  # 矩形 ROI 右侧宽度 (m)
    forward_length: 2.5               # 矩形 ROI 前方长度 (m)
    back_length: 0.5                  # 矩形 ROI 后方长度 (m)

    # -------------------------------------------------------------------------
    # 简单聚类参数（替代 perception_node.py 里的 KMeans 固定 K=10）
    # -------------------------------------------------------------------------
    cluster_radius: 0.25              # 聚类半径 (m) - 同簇内最大点间距，
                                       #   0.25 比 0.2 更宽松，能合并更多锥桶上点
    min_points_per_cluster: 5         # 单个簇最少点数，少于此值视为噪声丢弃

    # -------------------------------------------------------------------------
    # 内外道分离（核心几何逻辑：哪些锥桶在内圈、哪些在外圈）
    # -------------------------------------------------------------------------
    inner_dist_sq: 1.69               # 内道扩展距离平方 (1.3^2 = 1.69 m²)
    inner_y_threshold_sq: 1.21        # 内道扩展 Y 距离平方 (1.1^2 = 1.21 m²)
                                       #   限制新内道点必须在已知内道点左右 1.1m 内
    cut_length_y: 0.8                 # "斜边圆"决策边界：圆心到直边的 Y 距离
    cut_length_x: -0.7                # "斜边圆"决策边界：圆心到直边的 X 距离
    inner_to_outer_x_threshold: 0.3   # 内道点重分类为外道的 X 阈值 (m)
    inner_to_outer_y_threshold: 1.3   # 内道点重分类为外道的 Y 阈值 (m)

    # -------------------------------------------------------------------------
    # 圆形滤波(在内外道分离后，再次过滤离群点）
    # -------------------------------------------------------------------------
    max_radius: 7.0                   # 圆形滤波最大半径 (m) - 大于此距离的点丢弃
    max_y_filter: 0.5                 # 外道 Y 坐标过滤阈值 - 防止把内道误识别成外道
    min_inner_y_threshold: 0.8        # 内道点不足时使用的 Y 过滤阈值

    # -------------------------------------------------------------------------
    # 目标点选择策略
    # -------------------------------------------------------------------------
    target_jump: 3                    # 目标点跳数 - 跨越前面 N-1 个三等分点取第 N 个
                                       #   2022 国一报告里讨论过：低速选最近点抖动小，
                                       #   高速选远点反应更前瞻

    # -------------------------------------------------------------------------
    # 直角弯几何检测（用于触发 -20000 RIGHT_ANGLE 模式）
    # -------------------------------------------------------------------------
    wall_detection_min_distance: 1.7  # 墙检测最小距离 (m)
    wall_detection_max_distance: 1.9  # 墙检测最大距离 (m)
                                       #   两个阈值卡的是"前方有一道墙"的几何特征

    # -------------------------------------------------------------------------
    # 可视化（matplotlib 画聚类结果，调试用，比赛要关）
    # -------------------------------------------------------------------------
    enable_mapping: true              # 是否启用绘图。比赛建议设 false 减少 CPU 占用
    mapping_interval: 1               # 绘图间隔（帧数），1 = 每帧都画
    save_path: '/tmp/map.png'         # 图片保存路径
    show_window: true                 # 是否实时弹窗。SSH 无图形环境必须 false
